<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" aria-labelledby="title desc">
<title id="title">문 없는 통나무벽 16개와 선택형 외곽 선반·함정 배치도</title>
<desc id="desc">모닥불 주위를 변마다 통나무벽 네 개로 둘러싼다. 위쪽 왼편부터 시계 방향으로 01부터 16까지 연결한다. 바깥 선반은 선택형 확장이다. 함정 후보 T1은 북쪽, T2는 오른쪽, T3은 왼쪽의 벽과 선반 사이에 놓는다. 아래쪽 S 출입선과 안쪽 I 착지점에는 함정을 놓지 않는다. 수량과 비율은 설명용 예시다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#246b86" stroke-width="1.5"/></marker></defs>
<rect width="480" height="640" rx="14" fill="#e8eddf"/>
<g font-family="'Malgun Gothic',sans-serif" text-anchor="middle" fill="#203c32">
<text x="240" y="34" font-size="22" font-weight="700">A · 문 없이 닫는 기본형</text>
<text x="240" y="62" font-size="17">위에서 본 모습 · 번호 1개 = 벽 1개</text>
<rect x="43" y="92" width="394" height="402" rx="30" fill="none" stroke="#687879" stroke-width="12" stroke-dasharray="44 9"/>
<rect x="104" y="154" width="272" height="272" fill="#fffef8"/>
<g fill="#805636" stroke="#f5f2e9" stroke-width="1">
<rect x="100" y="150" width="74" height="22"/><rect x="170" y="150" width="74" height="22"/><rect x="240" y="150" width="74" height="22"/><rect x="310" y="150" width="74" height="22"/>
<rect x="362" y="150" width="22" height="74"/><rect x="362" y="220" width="22" height="74"/><rect x="362" y="290" width="22" height="74"/><rect x="362" y="360" width="22" height="74"/>
<rect x="310" y="412" width="74" height="22"/><rect x="240" y="412" width="74" height="22"/><rect x="170" y="412" width="74" height="22"/><rect x="100" y="412" width="74" height="22"/>
<rect x="100" y="360" width="22" height="74"/><rect x="100" y="290" width="22" height="74"/><rect x="100" y="220" width="22" height="74"/><rect x="100" y="150" width="22" height="74"/>
</g>
<g font-size="17" font-weight="700" fill="#fffef8">
<text x="146" y="168">01</text><text x="207" y="168">02</text><text x="277" y="168">03</text><text x="337" y="168">04</text>
<text x="373" y="199">05</text><text x="373" y="263">06</text><text x="373" y="333">07</text><text x="373" y="399">08</text>
<text x="337" y="429">09</text><text x="277" y="429">10</text><text x="207" y="429">11</text><text x="146" y="429">12</text>
<text x="111" y="399">13</text><text x="111" y="333">14</text><text x="111" y="263">15</text><text x="111" y="199">16</text>
</g>
<g fill="#fff3e8" stroke="#b94423" stroke-width="2"><circle cx="240" cy="121" r="20"/><circle cx="410" cy="290" r="20"/><circle cx="73" cy="290" r="20"/></g>
<g fill="#b94423" font-size="18" font-weight="700"><text x="240" y="127">T1</text><text x="410" y="296">T2</text><text x="73" y="296">T3</text></g>
<text x="240" y="210" font-size="18">문 없음 · 벽을 모두 연결</text>
<text x="240" y="237" font-size="17">안쪽 이동 공간은 비워 두기</text>
<circle cx="240" cy="285" r="32" fill="#f6d4a7"/>
<path d="M240 305c-30-12-12-29-6-46 3 16 21 22 17 34-1 7-6 10-11 12" fill="#b94423"/>
<text x="240" y="335" font-size="18">모닥불</text>
<rect x="137" y="353" width="72" height="32" rx="5" fill="#e8eddf"/><rect x="274" y="353" width="72" height="32" rx="5" fill="#e8eddf"/>
<text x="173" y="375" font-size="17">제작</text><text x="310" y="375" font-size="17">보급</text>
<rect x="214" y="373" width="52" height="29" rx="6" fill="#d6eaf0" stroke="#246b86" stroke-width="2"/><text x="240" y="394" font-size="18" fill="#246b86">I</text>
<path d="M240 545V505M240 484V440M240 409V402" fill="none" stroke="#246b86" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="322" y="470" font-size="17" fill="#246b86">점프로 출입</text>
<text x="326" y="491" font-size="16" fill="#246b86">함정 금지 구간</text>
<rect x="213" y="546" width="54" height="34" rx="5" fill="#d6eaf0" stroke="#246b86" stroke-width="2"/><text x="240" y="569" font-size="19" fill="#246b86">S</text>
<text x="240" y="606" font-size="18">갈색 = 통나무벽 / 회색 = 선택형 선반</text>
<text x="240" y="629" font-size="16">T = 함정 후보 · S / I = 밖 / 안 출입 발판</text>
</g></svg>
