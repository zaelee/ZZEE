<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020202">
  <title>2026 OSSE FESTIVAL — Glass Object</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #020202;
    }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      background: #020202;
      color: #f5f5f2;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: 0;
      touch-action: none;
    }

    canvas.dragging { cursor: grabbing; }
    canvas:focus-visible { outline: 1px solid rgba(255, 255, 255, .5); outline-offset: -5px; }

    .ui {
      position: fixed;
      z-index: 2;
      inset: 0;
      padding: clamp(20px, 2.6vw, 42px);
      pointer-events: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand::before {
      width: 9px;
      height: 14px;
      border-radius: 80% 20% 70% 30%;
      background: #fff;
      content: "";
      transform: rotate(-18deg);
    }

    nav {
      display: flex;
      gap: clamp(22px, 3vw, 52px);
    }

    .copy {
      position: absolute;
      bottom: clamp(28px, 4vw, 62px);
      left: clamp(20px, 2.6vw, 42px);
      max-width: 180px;
      margin: 0;
      font-size: clamp(14px, 1.35vw, 21px);
      font-weight: 700;
      line-height: .92;
      letter-spacing: -.045em;
    }

    .index {
      position: absolute;
      right: clamp(20px, 2.6vw, 42px);
      bottom: clamp(22px, 3vw, 44px);
      color: rgba(255, 255, 255, .28);
      font-size: clamp(54px, 8vw, 132px);
      font-weight: 400;
      line-height: .8;
      letter-spacing: -.08em;
    }

    .hint {
      position: absolute;
      right: clamp(22px, 3vw, 48px);
      top: 50%;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, .46);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      transform: rotate(90deg) translateX(50%);
      transform-origin: right center;
    }

    .hint::before {
      width: 34px;
      height: 1px;
      background: rgba(255, 255, 255, .38);
      content: "";
    }

    .loading {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: 20px;
      color: rgba(255, 255, 255, .54);
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      transform: translateX(-50%);
      transition: opacity .5s ease;
    }

    .loading.done { opacity: 0; }

    .bevel-panel {
      position: fixed;
      z-index: 5;
      top: 76px;
      left: 24px;
      width: min(280px, calc(100vw - 48px));
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 14px;
      background: rgba(8, 8, 8, .78);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .28);
      backdrop-filter: blur(18px);
    }

    .bevel-panel h2 {
      margin: 0 0 14px;
      font-size: 11px;
      letter-spacing: .16em;
    }

    .bevel-control {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 5px 10px;
      align-items: center;
      margin: 0 0 11px;
      color: rgba(255, 255, 255, .76);
      font-size: 10px;
      letter-spacing: .05em;
    }

    .bevel-control output { color: #fff; font-family: Consolas, monospace; }
    .bevel-control input { grid-column: 1 / -1; width: 100%; accent-color: #fff; }

    .bevel-readout {
      margin: 14px 0 0;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, .14);
      color: rgba(255, 255, 255, .72);
      font: 10px/1.5 Consolas, monospace;
    }

    .bevel-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .bevel-buttons { display: flex; gap: 6px; }
    .bevel-status { color: rgba(255, 255, 255, .42); font-size: 9px; letter-spacing: .08em; }
    .bevel-panel button {
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font: 9px Arial, sans-serif;
      cursor: pointer;
    }

    @media (max-width: 620px) {
      nav span:nth-child(2) { display: none; }
      .copy { max-width: 130px; }
      .hint { display: none; }
      .index { font-size: 18vw; }
      .bevel-panel { top: 60px; left: 14px; width: 230px; padding: 12px; }
    }

    .ui,
    .bevel-panel { display: none; }
  </style>
</head>
<body>
  <div class="ui" aria-hidden="true">
    <header>
      <div class="brand">Design World</div>
      <nav><span>Home</span><span>Portfolio</span><span>Contact us</span></nav>
    </header>
    <p class="copy">Let’s build the<br>future of<br>design.</p>
    <span class="hint">Drag to rotate · Click to open · Hold to stretch</span>
    <span class="index">01</span>
  </div>
  <div class="loading" id="loading" role="status">Loading glass object</div>

  <section class="bevel-panel" aria-labelledby="bevel-title">
    <h2 id="bevel-title">LIVE BEVEL LAB</h2>
    <label class="bevel-control">Bevel size (fixed) <output id="sizeValue">9.5</output>
      <input id="bevelSize" type="range" min="0" max="16" step="0.5" value="9.5" disabled>
    </label>
    <label class="bevel-control">Bevel depth <output id="depthValue">10</output>
      <input id="bevelDepth" type="range" min="0" max="30" step="1" value="10">
    </label>
    <label class="bevel-control">Inset (fixed) <output id="insetValue">4.5</output>
      <input id="bevelInset" type="range" min="0" max="16" step="0.5" value="4.5" disabled>
    </label>
    <label class="bevel-control">Smoothness <output id="segmentsValue">18</output>
      <input id="bevelSegments" type="range" min="2" max="24" step="1" value="18">
    </label>
    <p class="bevel-readout" id="bevelReadout">size 9.5 · depth 10 · inset 4.5 · segments 18</p>
    <div class="bevel-actions"><span class="bevel-status" id="bevelStatus">READY</span><span class="bevel-buttons"><button id="introReplay" type="button">REPLAY INTRO</button><button id="bevelReset" type="button">RESET</button></span></div>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

    const loading = document.querySelector('#loading');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(37, innerWidth / innerHeight, 1, 2500);
    camera.position.set(0, 0, 820);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.16;
    renderer.domElement.setAttribute('aria-label', '드래그하거나 방향키로 돌리고 클릭하면 열 수 있는 프리즘 3D 유리 오브젝트');
    renderer.domElement.setAttribute('role', 'button');
    renderer.domElement.setAttribute('aria-pressed', 'false');
    renderer.domElement.tabIndex = 0;
    document.body.prepend(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), .03).texture;
    pmrem.dispose();

    const key = new THREE.PointLight(0xffffff, 120000, 1000, 1.7);
    key.position.set(-340, 330, 390);
    scene.add(key);

    const fill = new THREE.PointLight(0xffffff, 42000, 850, 1.8);
    fill.position.set(360, -160, 260);
    scene.add(fill);

    const warm = new THREE.PointLight(0xffffff, 42000, 760, 2);
    warm.position.set(-300, -260, 40);
    scene.add(warm);

    const backdrop = document.createElement('canvas');
    const backdropTexture = new THREE.CanvasTexture(backdrop);
    backdropTexture.colorSpace = THREE.SRGBColorSpace;
    scene.background = backdropTexture;

    function drawBackdrop() {
      const scale = Math.min(devicePixelRatio, 2);
      backdrop.width = Math.max(800, Math.round(innerWidth * scale));
      backdrop.height = Math.max(600, Math.round(innerHeight * scale));
      const ctx = backdrop.getContext('2d');
      const w = backdrop.width;
      const h = backdrop.height;
      const size = Math.min(w * .155, h * .245);

      ctx.fillStyle = '#020202';
      ctx.fillRect(0, 0, w, h);

      const glow = ctx.createRadialGradient(w * .5, h * .5, 0, w * .5, h * .5, w * .58);
      glow.addColorStop(0, '#171717');
      glow.addColorStop(.5, '#090909');
      glow.addColorStop(1, '#010101');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#f4f4ef';
      ctx.font = `900 ${size}px Arial, sans-serif`;

      const textWidth = Math.min(w * .82, h * 1.65);
      const textLeft = (w - textWidth) / 2;
      function fillJustified(text, y) {
        const letters = [...text];
        const widths = letters.map(letter => ctx.measureText(letter).width);
        const spacing = (textWidth - widths.reduce((sum, width) => sum + width, 0)) / (letters.length - 1);
        let x = textLeft;
        letters.forEach((letter, index) => {
          ctx.fillText(letter, x, y);
          x += widths[index] + spacing;
        });
      }

      fillJustified('2026', h * .28);
      fillJustified('OSSE', h * .5);
      fillJustified('FESTIVAL', h * .72);

      backdropTexture.needsUpdate = true;
    }

    drawBackdrop();

    const pivot = new THREE.Group();
    pivot.rotation.set(-.18, .42, -.09);
    scene.add(pivot);

    const glass = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0,
      roughness: 0,
      transmission: 1,
        thickness: 185,
        ior: 1.72,
        dispersion: 0,
      specularIntensity: 1,
      envMapIntensity: .55,
      clearcoat: 1,
      clearcoatRoughness: 0,
      iridescence: 0
    });

    function applyDuoPrism(material) {
      material.onBeforeCompile = shader => {
        shader.fragmentShader = shader.fragmentShader.replace('#include <opaque_fragment>', `
          float prismEdge = pow(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 2.2);
          float prismBand = step(0.0, sin(vViewPosition.x * 0.035 - vViewPosition.y * 0.055));
          vec3 prismOrange = vec3(1.0, 0.12, 0.0);
          vec3 prismGreen = vec3(0.08, 1.0, 0.02);
          outgoingLight += mix(prismOrange, prismGreen, prismBand) * smoothstep(0.08, 0.72, prismEdge) * 1.25;
          #include <opaque_fragment>
        `);
      };
      material.needsUpdate = true;
    }

    applyDuoPrism(glass);

    const dropletGeometry = new THREE.SphereGeometry(118, 72, 48);
    const dropletPosition = dropletGeometry.attributes.position;
    for (let i = 0; i < dropletPosition.count; i += 1) {
      const y = dropletPosition.getY(i);
      const taper = 1 - Math.max(0, y / 118) * .14;
      dropletPosition.setX(i, dropletPosition.getX(i) * taper);
      dropletPosition.setY(i, y * 1.07);
      dropletPosition.setZ(i, dropletPosition.getZ(i) * taper);
    }
    dropletGeometry.computeVertexNormals();
    const dropletMaterial = glass.clone();
    dropletMaterial.thickness = 120;
    applyDuoPrism(dropletMaterial);
    const droplet = new THREE.Mesh(dropletGeometry, dropletMaterial);
    droplet.visible = !reducedMotion;
    droplet.scale.setScalar(reducedMotion ? 0 : .001);
    pivot.add(droplet);
    let introTime = 0;
    let introRunning = !reducedMotion;

    const sourceSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 473.98 413.81"><path d="M236.99,413.81c117.26,0,236.99-29.75,236.99-161.03v-90.46c0-90.62-57.19-132.39-130.99-150.31-40.88-9.93-81.03.68-107.34,18.37-28.77,19.33-49.18,48.51-55.71,68.12-1.18,3.5.61,3.55,1.81,2.68,6.89-4.9,19.04-7.07,25.72-8.02,3.44-.34,6.98-.62,10.55-.85l2.89-.15c5.22-.26,10.55-.36,16.06-.36,62.56,0,107.27,14.17,107.27,73.37v84.74c0,59.25-44.7,73.41-107.27,73.41s-107.26-14.16-107.26-73.41v-78.44c0-59.11,24.35-139.2,130.58-166.29,1.76-.42,1.59-2.6-.98-3.11C247.77-.08,227.78-.3,214.73.27,84.65,5.9,0,44.95,0,165.48v87.31c0,131.28,119.73,161.03,236.99,161.03"/></svg>`;
    const parsedSvg = new SVGLoader().parse(sourceSvg);
    const [sourceShape] = parsedSvg.paths.flatMap(path => SVGLoader.createShapes(path));
    const sampledPoints = sourceShape.getPoints(32);
    const innerSplit = sampledPoints.reduce((best, point, index) => {
      const distance = point.distanceToSquared(new THREE.Vector2(236.99, 323.32));
      return distance < best.distance ? { index, distance } : best;
    }, { index: -1, distance: Infinity });
    const halfOpenDistance = (903.84 - 473.98) / 2;
    const basePoints = [];
    const baseSides = [];

    sampledPoints.forEach((point, index) => {
      const side = index <= innerSplit.index ? 1 : -1;
      if (index === 0) {
        basePoints.push(new THREE.Vector2(point.x + .01, point.y));
        baseSides.push(1);
      } else if (index === innerSplit.index) {
        basePoints.push(new THREE.Vector2(point.x + .01, point.y), new THREE.Vector2(point.x - .01, point.y));
        baseSides.push(1, -1);
      } else if (index === sampledPoints.length - 1) {
        basePoints.push(new THREE.Vector2(point.x - .01, point.y));
        baseSides.push(-1);
      } else {
        basePoints.push(point.clone());
        baseSides.push(side);
      }
    });

    const controls = {
      size: document.querySelector('#bevelSize'),
      depth: document.querySelector('#bevelDepth'),
      inset: document.querySelector('#bevelInset'),
      segments: document.querySelector('#bevelSegments')
    };
    const outputs = {
      size: document.querySelector('#sizeValue'),
      depth: document.querySelector('#depthValue'),
      inset: document.querySelector('#insetValue'),
      segments: document.querySelector('#segmentsValue')
    };
    const readout = document.querySelector('#bevelReadout');
    const status = document.querySelector('#bevelStatus');
    const morphMeshes = [];
    let previewMesh;
    let rebuildTimer;
    let openAmount = 0;
    let openTarget = 0;

    function values() {
      return {
        size: Number(controls.size.value),
        depth: Number(controls.depth.value),
        inset: Number(controls.inset.value),
        segments: Number(controls.segments.value)
      };
    }

    function updateReadout() {
      const current = values();
      Object.keys(outputs).forEach(key => { outputs[key].textContent = current[key]; });
      readout.textContent = `size ${current.size} · depth ${current.depth} · inset ${current.inset} · segments ${current.segments}`;
    }

    function createGeometry() {
      const current = values();
      const geometry = new THREE.ExtrudeGeometry(new THREE.Shape(basePoints), {
        curveSegments: 1,
        steps: 1,
        depth: 134,
        bevelEnabled: current.size > 0 && current.depth > 0,
        bevelThickness: current.depth,
        bevelSize: current.size,
        bevelOffset: -current.inset,
        bevelSegments: current.segments
      });
      geometry.computeBoundingBox();
      const center = geometry.boundingBox.getCenter(new THREE.Vector3());
      geometry.translate(-center.x, -center.y, -center.z);
      geometry.rotateX(Math.PI);

      const position = geometry.attributes.position;
      const contour = basePoints.map((point, index) => ({
        x: point.x - center.x,
        y: -(point.y - center.y),
        side: baseSides[index]
      }));
      const openPosition = position.clone();

      for (let i = 0; i < position.count; i += 1) {
        const x = position.getX(i);
        const y = position.getY(i);
        let nearestSide = 1;
        let nearestDistance = Infinity;
        for (const point of contour) {
          const distance = (x - point.x) ** 2 + (y - point.y) ** 2;
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearestSide = point.side;
          }
        }
        openPosition.setX(i, x + nearestSide * halfOpenDistance);
      }

      openPosition.name = 'Open';
      geometry.morphAttributes.position = [openPosition];
      geometry.computeBoundingBox();
      return toCreasedNormals(geometry, Math.PI / 3);
    }

    function rebuildGeometry() {
      status.textContent = 'BUILDING';
      try {
        const geometry = createGeometry();
        if (!previewMesh) {
          previewMesh = new THREE.Mesh(geometry, glass);
          previewMesh.scale.setScalar(introRunning ? .001 : .72);
          pivot.add(previewMesh);
        } else {
          const oldGeometry = previewMesh.geometry;
          previewMesh.geometry = geometry;
          oldGeometry.dispose();
        }
        previewMesh.updateMorphTargets();
        previewMesh.morphTargetInfluences[0] = openAmount;
        morphMeshes[0] = previewMesh;
        status.textContent = 'READY';
        loading.classList.add('done');
      } catch (error) {
        console.error(error);
        status.textContent = 'INVALID';
      }
    }

    function scheduleRebuild() {
      updateReadout();
      status.textContent = 'WAIT';
      clearTimeout(rebuildTimer);
      rebuildTimer = setTimeout(rebuildGeometry, 90);
    }

    [controls.depth, controls.segments].forEach(control => control.addEventListener('input', scheduleRebuild));
    document.querySelector('#introReplay').addEventListener('click', replayIntro);
    document.querySelector('#bevelReset').addEventListener('click', () => {
      controls.size.value = 9.5;
      controls.depth.value = 10;
      controls.inset.value = 4.5;
      controls.segments.value = 18;
      scheduleRebuild();
    });
    updateReadout();
    rebuildGeometry();

    function replayIntro() {
      if (!previewMesh || reducedMotion) return;
      introTime = 0;
      introRunning = true;
      openAmount = openTarget = 0;
      previewMesh.morphTargetInfluences[0] = 0;
      previewMesh.scale.setScalar(.001);
      previewMesh.rotation.set(0, -.65, -.35);
      droplet.visible = true;
      droplet.scale.setScalar(.001);
      droplet.rotation.set(0, 0, 0);
    }

    let pointerX = 0;
    let pointerY = 0;
    let smoothX = 0;
    let smoothY = 0;
    let manualYaw = 0;
    let manualPitch = 0;
    let velocityYaw = 0;
    let velocityPitch = 0;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let pressTravel = 0;
    let pressStartedAt = 0;
    let longPress = false;
    const canvas = renderer.domElement;
    const longPressDelay = 300;
    const longPressMax = 1.8;

    function toggleOpen() {
      openTarget = openTarget > .01 ? 0 : 1;
      canvas.setAttribute('aria-pressed', String(Boolean(openTarget)));
    }

    canvas.addEventListener('pointerdown', event => {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      pressTravel = 0;
      pressStartedAt = performance.now();
      longPress = false;
      velocityYaw = velocityPitch = 0;
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('dragging');
    });

    canvas.addEventListener('pointermove', event => {
      pointerX = event.clientX / innerWidth - .5;
      pointerY = event.clientY / innerHeight - .5;
      if (!dragging) return;

      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;
      pressTravel += Math.hypot(dx, dy);
      lastX = event.clientX;
      lastY = event.clientY;
      manualYaw += dx * .007;
      manualPitch = THREE.MathUtils.clamp(manualPitch + dy * .006, -1.15, 1.15);
      velocityYaw = dx * .0016;
      velocityPitch = dy * .0012;
    });

    function release(event) {
      if (!dragging) return;
      const clicked = event.type === 'pointerup' && pressTravel < 7 && !longPress;
      dragging = false;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      canvas.classList.remove('dragging');
      if (clicked && !introRunning) toggleOpen();
    }

    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    canvas.addEventListener('lostpointercapture', () => {
      dragging = false;
      canvas.classList.remove('dragging');
    });

    canvas.addEventListener('pointerleave', () => {
      if (!dragging) pointerX = pointerY = 0;
    });

    canvas.addEventListener('keydown', event => {
      const step = .14;
      if ((event.key === 'Enter' || event.key === ' ') && !introRunning) toggleOpen();
      else if (event.key === 'ArrowLeft') manualYaw -= step;
      else if (event.key === 'ArrowRight') manualYaw += step;
      else if (event.key === 'ArrowUp') manualPitch = Math.max(-1.15, manualPitch - step);
      else if (event.key === 'ArrowDown') manualPitch = Math.min(1.15, manualPitch + step);
      else return;
      event.preventDefault();
    });

    const clock = new THREE.Clock();
    let time = 0;
    let idleYaw = 0;
    renderer.setAnimationLoop(() => {
      const delta = Math.min(clock.getDelta(), .05);
      time += delta;
      if (dragging && pressTravel < 7 && !introRunning && performance.now() - pressStartedAt >= longPressDelay) {
        longPress = true;
        openTarget = Math.min(longPressMax, Math.max(1, openTarget) + delta * .85);
        canvas.setAttribute('aria-pressed', 'true');
      }
      openAmount = reducedMotion ? openTarget : THREE.MathUtils.damp(openAmount, openTarget, 5.5, delta);
      morphMeshes.forEach(mesh => { mesh.morphTargetInfluences[0] = openAmount; });

      if (introRunning && previewMesh) {
        introTime += delta;
        const dropIn = 1 - Math.pow(1 - THREE.MathUtils.clamp(introTime / .55, 0, 1), 3);
        const reveal = THREE.MathUtils.smoothstep(introTime, .5, 2.15);
        const disappear = 1 - reveal * reveal;
        const back = 1 + 2.70158 * (reveal - 1) ** 3 + 1.70158 * (reveal - 1) ** 2;

        droplet.scale.set(
          dropIn * (1 + reveal * .46) * disappear,
          dropIn * (1 - reveal * .28) * disappear,
          dropIn * (1 - reveal * .58) * disappear
        );
        droplet.rotation.z = reveal * .36;
        droplet.rotation.y = reveal * .5;

        const formScale = .72 * Math.max(.001, back);
        previewMesh.scale.set(formScale, formScale * (.7 + reveal * .3), formScale);
        previewMesh.rotation.y = -.65 * (1 - reveal);
        previewMesh.rotation.z = -.35 * (1 - reveal);

        if (introTime >= 2.15) {
          introRunning = false;
          droplet.visible = false;
          previewMesh.scale.setScalar(.72);
          previewMesh.rotation.set(0, 0, 0);
        }
      }
      smoothX += (pointerX - smoothX) * .045;
      smoothY += (pointerY - smoothY) * .045;

      if (!dragging && !reducedMotion) {
        manualYaw += velocityYaw * delta * 60;
        manualPitch = THREE.MathUtils.clamp(manualPitch + velocityPitch * delta * 60, -1.15, 1.15);
        const damping = Math.pow(.92, delta * 60);
        velocityYaw *= damping;
        velocityPitch *= damping;
        idleYaw += delta * .035;
      }

      pivot.rotation.x = -.18 + manualPitch - smoothY * .24 + (reducedMotion ? 0 : Math.sin(time * .42) * .055);
      pivot.rotation.y = .42 + manualYaw + idleYaw + smoothX * .3;
      pivot.rotation.z = -.09 + smoothX * .12 + (reducedMotion ? 0 : Math.sin(time * .27) * .04);
      pivot.position.y = reducedMotion ? 0 : Math.sin(time * .75) * 8;

      camera.position.x = smoothX * 26;
      camera.position.y = -smoothY * 18;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      drawBackdrop();
    });
  </script>
</body>
</html>
